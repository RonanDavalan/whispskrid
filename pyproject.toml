[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispskrid"
version = "0.1.0a0"
description = "Outil CLI de dictée appui-pour-parler adossé à Whisper (faster-whisper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ronan Davalan" }]
dependencies = [
    "faster-whisper",
]

[project.scripts]
whispskrid = "whispskrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
