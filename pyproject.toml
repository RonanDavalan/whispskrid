[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispskrid"
version = "1.0.1"
description = "Outil CLI de dictée appui-pour-parler adossé à Whisper (faster-whisper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ronan Davalan" }]
dependencies = [
    "faster-whisper",
    "pyyaml",
    "pyaudio",
    "pyperclip",
    "numpy",
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest"]
# Réservé — mode armé par mot vocal. Non listé dans `dependencies` :
# aucune dépendance à openwakeword tant que hotkeys.mode: armed n'est pas
# câblé (session.py ne l'importe qu'à l'usage, jamais au chargement du
# paquet), et le paquet doit rester installable sans elle.
wakeword = ["openwakeword==0.4.0"]

[project.scripts]
whispskrid = "whispskrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whispskrid = ["locales/*/LC_MESSAGES/*.mo", "config.yaml"]
